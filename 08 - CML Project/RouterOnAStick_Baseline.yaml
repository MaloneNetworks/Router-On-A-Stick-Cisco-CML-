lab:
  description: ''
  notes: |
    1. Scenario
    You have been hired as a junior network administrator for a small company.

    The company has three departments:
    - Administration – VLAN 10
    - IT Department – VLAN 20
    - Operations – VLAN 30
    The company has two switches and one router. Employees need to communicate within their own departments and across departments.

    Your job is to build the network, configure VLANs, establish trunk connections, configure router-on-a-stick, and provide automatic IP addressing through DHCP.

    VLAN 10 - ADMINISTRATION
    Network:        192.168.10.0/24
    Subnet Mask:    255.255.255.0
    Default Gateway:192.168.10.1

    VLAN 20 - IT
    Network:        192.168.20.0/24
    Subnet Mask:    255.255.255.0
    Default Gateway:192.168.20.1

    VLAN 30 - OPERATIONS
    Network:        192.168.30.0/24
    Subnet Mask:    255.255.255.0
    Default Gateway:192.168.30.1

    VLAN 99 - MANAGEMENT
    Network:        192.168.99.0/24
    Subnet Mask:    255.255.255.0
    Default Gateway:192.168.99.1
  title: RouterOnAStick Baseline
  node_staging:
    enabled: false
    start_remaining: true
    abort_on_failure: false
  version: 0.3.1
